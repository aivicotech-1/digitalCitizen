<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Castle</title>
<style>
:root{--ink:#1d2a44;--go:#2e9e57;--stop:#d93a3a;--head:#3b4a8c}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#eef0fa;color:var(--ink)}
header{background:var(--head);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center}
header h1{margin:0;font-size:26px}.coins{font-size:22px;font-weight:bold}
main{max-width:1100px;margin:14px auto;padding:0 14px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.box{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.def{display:flex;align-items:center;gap:12px;border:3px solid #d7dcef;border-radius:14px;padding:10px;margin:8px 0;cursor:pointer}
.def.on{border-color:var(--go);background:#e9f8ee}
.def .ic{font-size:30px;width:44px;text-align:center}.def b{font-size:19px}.def div{font-size:16px}
svg{width:100%;background:#cfe8ff;border-radius:14px}
button{font-size:20px;font-weight:bold;border:none;border-radius:14px;padding:12px 18px;cursor:pointer;color:#fff;margin:8px 6px 0 0}
ul{list-style:none;padding:0;font-size:18px}li{padding:7px 10px;border-radius:10px;margin:6px 0}
.ok{background:#dff5e6}.bad{background:#fde3e3}
</style><link rel="stylesheet" href="../../assets/activity-ui.css"><script src="../../assets/activity-descriptions.js" defer></script></head>
<body class="activity-ui" data-grade="4" data-activity="cyber-castle"><header><nav class="activity-navigation" aria-label="Activity navigation"><a class="activity-back" href="../../activities.html?grade=4"><span aria-hidden="true">&larr;</span> Back to Grade 4 activities</a><button type="button" class="activity-description-trigger" aria-haspopup="dialog" aria-controls="activity-description-dialog">Description</button></nav><div class="activity-kicker">Skill2Success <span>Grade 4 &middot; Digital citizenship</span></div><h1>Cyber Castle</h1><div class="coins" id="coins"></div></header>
<main>
<div class="box">
  <p style="font-size:18px;margin-top:0">Your castle keeps your <b>data</b> safe: photos, games, homework and messages. Choose your defences. Each defence costs 1 coin.</p>
  <div id="defs"></div>
  <button style="background:#d93a3a" onclick="attack()">Send the attacks!</button>
  <button style="background:#8a95a8" onclick="reset()" data-ui-action="secondary">Start again</button>
  <p style="font-size:15px;color:#56627a">A pretend game. Nothing is saved or sent.</p>
</div>
<div class="box">
  <svg viewBox="0 0 400 260" id="castle"></svg>
  <ul id="res"></ul>
  <p id="sum" style="font-size:20px;font-weight:bold"></p>
</div>
</main>
<script>
var D=[
 {k:'lock',ic:'\u{1F512}',n:'Strong lock',d:'A strong password or PIN that nobody else knows.'},
 {k:'guard',ic:'\u{1F6E1}',n:'Guard (antivirus)',d:'Checks files and stops computer germs.'},
 {k:'walls',ic:'\u{1F9F1}',n:'Fixed walls (updates)',d:'Updates fix weak spots that attackers know about.'},
 {k:'copy',ic:'\u{1F4BE}',n:'Spare copy (backup)',d:'A copy of your data kept safe somewhere else.'},
 {k:'smart',ic:'\u{1F9E0}',n:'Smart thinking',d:'Stop, think and ask before clicking links or messages.'}];
var A=[
 {n:'A stranger guesses your password "1234".',need:'lock',win:'The strong lock stopped the guess.',lose:'Easy password guessed. The stranger got in.'},
 {n:'A game cheat file hides a computer germ.',need:'guard',win:'The guard spotted the germ and blocked it.',lose:'The germ got in and started breaking things.'},
 {n:'An attacker uses an old weak spot in the software.',need:'walls',win:'Updates had already fixed that weak spot.',lose:'The old weak spot let the attacker in.'},
 {n:'The laptop falls and breaks.',need:'copy',win:'Your spare copy saved all your photos and homework.',lose:'No backup. Your photos and homework are lost.'},
 {n:'A message says "Click here for free gems!"',need:'smart',win:'You stopped, thought and asked. No trick worked.',lose:'You clicked the trick link and it caused trouble.'}];
var on={},round=1;var MAXC=[3,5];
function el(x){return document.getElementById(x)}
function coins(){return MAXC[Math.min(round-1,1)]-Object.keys(on).length}
function draw(){var d=el('defs');d.innerHTML='';D.forEach(function(x){var e=document.createElement('div');e.className='def'+(on[x.k]?' on':'');e.innerHTML='<span class="ic">'+x.ic+'</span><span><b></b><div></div></span>';e.querySelector('b').textContent=x.n;e.querySelector('div').textContent=x.d;
 e.onclick=function(){if(on[x.k])delete on[x.k];else if(coins()>0)on[x.k]=1;draw()};d.appendChild(e)});
 el('coins').textContent='Round '+round+'  ·  Coins left: '+coins();castle()}
function castle(){var s='<rect x="90" y="90" width="220" height="140" fill="#b7a07a" stroke="#6d5a3b" stroke-width="4"/>';
 for(var i=0;i<5;i++)s+='<rect x="'+(90+i*46)+'" y="70" width="28" height="22" fill="#b7a07a" stroke="#6d5a3b" stroke-width="4"/>';
 s+='<rect x="180" y="170" width="40" height="60" fill="#6d5a3b"/><circle cx="200" cy="140" r="16" fill="#f2c94c"/><text x="200" y="146" text-anchor="middle" font-size="14" font-family="Arial">data</text>';
 var i=0;D.forEach(function(x){if(on[x.k]){s+='<text x="'+(40+i*80)+'" y="40" font-size="28">'+x.ic+'</text>';i++}});el('castle').innerHTML=s}
function attack(){var r=el('res');r.innerHTML='';var safe=0;A.forEach(function(a){var ok=!!on[a.need];if(ok)safe++;var li=document.createElement('li');li.className=ok?'ok':'bad';li.textContent=(ok?'✔ ':'✖ ')+a.n+' '+(ok?a.win:a.lose);r.appendChild(li)});
 el('sum').textContent=safe+' of 5 attacks stopped. '+(round===1?'Talk with your partner: which defence would you add next? Then click Start again for round 2 with 5 coins.':(safe===5?'Your castle is fully protected!':'Which defence is missing?'))}
function reset(){if(el('res').innerHTML)round=round===1?2:1;on={};el('res').innerHTML='';el('sum').textContent='';draw()}
draw();
</script></body></html>
