<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account Guard</title><style>
:root{--ink:#1d2a44;--blue:#2f6fd6;--go:#2e9e57;--warn:#e0a400;--stop:#d93a3a}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#e9f8f7;color:var(--ink)}
header{background:#0f8a8a;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{margin:0;font-size:26px}.score{font-size:22px;font-weight:bold}
main{max-width:900px;margin:22px auto;padding:0 16px;text-align:center}
.intro{font-size:21px}.note{font-size:16px;color:#56627a;margin-top:24px}
.card{background:#fff;border-radius:20px;padding:26px;box-shadow:0 4px 16px rgba(0,0,0,.1);margin-top:10px}
.who{font-size:17px;color:#56627a;margin-bottom:8px;font-weight:bold;text-transform:uppercase;letter-spacing:.5px}
.text{font-size:27px;font-weight:bold;line-height:1.35}
.opts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.opts button,.go{font-size:21px;font-weight:bold;border:none;border-radius:16px;padding:16px 20px;cursor:pointer;color:#fff;min-width:200px}
.fb{font-size:21px;margin-top:18px;padding:14px;border-radius:14px;display:none}
.good{background:#dff5e6;border:3px solid var(--go)}.oops{background:#fde3e3;border:3px solid var(--stop)}
.go{background:var(--ink);margin-top:14px;display:none}
.big{font-size:30px;font-weight:bold}.stars{font-size:54px;color:#f2b632}
.prog{font-size:17px;color:#56627a;margin-top:6px}
</style><link rel="stylesheet" href="../../assets/activity-ui.css"><script src="../../assets/activity-descriptions.js" defer></script></head>
<body class="activity-ui" data-grade="3" data-activity="account-guard"><header><nav class="activity-navigation" aria-label="Activity navigation"><a class="activity-back" href="../../activities.html?grade=3"><span aria-hidden="true">&larr;</span> Back to Grade 3 activities</a><button type="button" class="activity-description-trigger" aria-haspopup="dialog" aria-controls="activity-description-dialog">Description</button></nav><div class="activity-kicker">Skill2Success <span>Grade 3 &middot; Digital citizenship</span></div><h1>Account Guard</h1><div class="score" id="score">Stars: 0</div></header>
<main>
<div id="start"><p class="intro">Your account is like a treasure tower. Choose the safe action to guard it.</p><div class="opts"><button style="background:#0f8a8a" onclick="begin()" data-ui-action="primary">Start</button></div></div>
<div id="play" style="display:none"><div class="card"><div class="who" id="who"></div><div class="text" id="text"></div><div class="prog" id="prog"></div></div>
<div class="opts" id="opts"></div><div class="fb" id="fb"></div><button class="go" id="next" onclick="nxt()" data-ui-action="next">Next</button>
<button type="button" id="skip" class="activity-skip" data-ui-action="secondary" onclick="skipTask()" title="Move on without completing this task. No points are added.">Skip question</button></div>
<div id="end" style="display:none"><div class="stars" id="stars"></div><p class="big" id="endmsg"></p><button class="go" style="display:inline-block" onclick="again()" data-ui-action="secondary">Play again</button></div>
<p class="note">A practice game for school. Nothing you do here is saved or sent.</p>
</main><script>
var C=[["School computer", "You have finished your work on a shared computer.", ["Walk away", "Log out first"], 1, "Logging out stops the next person using your account."], ["Friend", "Your best friend asks for your password to help you in a game.", ["Say no kindly", "Tell them, they are your friend"], 0, "Passwords are secret, even from friends. Only a parent or guardian may know."], ["Tablet", "You are going for lunch and leaving the tablet on the desk.", ["Lock the screen", "Leave it open"], 0, "Locking the screen keeps your things safe while you are away."], ["Message", "A message says: your account is locked, type your password here.", ["Type the password", "Stop and tell a grown-up"], 1, "Messages asking for passwords are tricks."], ["Sticky note", "Your password is written on a note stuck to the screen.", ["Leave it there", "Remove it and tell a grown-up"], 1, "Anyone could read it. Keep passwords hidden."], ["Game", "Someone posted something mean from your game account.", ["Tell a grown-up and change the password with help", "Ignore it"], 0, "Someone may know your password. A grown-up can help you change it."], ["Password", "You need a new password.", ["tiger", "MangoKite!Rocket7"], 1, "Long, mixed and not about you makes a strong password."], ["Shared phone", "You used Ammi's phone to sign in to your learning app.", ["Sign out when done", "Stay signed in"], 0, "Sign out so your account stays yours."], ["Pop-up", "The browser asks: save your password on this school computer?", ["Yes, save it", "No, do not save"], 1, "On shared computers, do not save passwords."], ["Login screen", "Someone is watching while you type your password.", ["Ask them to look away", "Type it slowly for them"], 0, "Cover the keys or ask them to look away."]],i=0,score=0,done=false;function el(x){return document.getElementById(x)}
function begin(){el('start').style.display='none';el('play').style.display='block';i=0;score=0;el('score').textContent='Stars: 0';show()}
function show(){done=false;el('skip').style.display='inline-block';var c=C[i];el('who').textContent=c[0];el('text').textContent=c[1];el('prog').textContent='Card '+(i+1)+' of '+C.length;var o=el('opts');o.innerHTML='';
 var cols=['#2f6fd6','#e07a1f','#7a3fd1'];c[2].forEach(function(l,k){var b=document.createElement('button');b.textContent=l;b.style.background=cols[k];b.onclick=function(){pick(k)};o.appendChild(b)});el('fb').style.display='none';el('next').style.display='none'}
function pick(k){if(done)return;done=true;el('skip').style.display='none';var c=C[i],ok=(k===c[3]);if(ok){score++;el('score').textContent='Stars: '+score}var f=el('fb');f.className='fb '+(ok?'good':'oops');
 f.textContent=(ok?'Yes! ':'Think again. The safe choice is: '+c[2][c[3]]+'. ')+c[4];f.style.display='block';el('next').style.display='inline-block'}
function skipTask(){if(done)return;done=true;el('skip').style.display='none';nxt()}
function nxt(){i++;if(i>=C.length){el('play').style.display='none';el('end').style.display='block';var s='';for(var k=0;k<score;k++)s+='\u2605';el('stars').textContent=s||'\u2606';el('endmsg').textContent='You got '+score+' out of '+C.length+'. Keep passwords secret, log out, lock the screen and tell a grown-up when something is wrong.'}else show()}
function again(){el('end').style.display='none';begin()}
</script></body></html>
