<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Defence HQ</title>
<style>
:root{--ink:#1d2a44;--head:#12263f;--neon:#39d98a}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#e7ecf3;color:var(--ink)}
header{background:var(--head);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center}
header h1{margin:0;font-size:26px}#pts{font-size:21px;font-weight:bold;color:var(--neon)}
main{max-width:1150px;margin:14px auto;padding:0 14px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:880px){main{grid-template-columns:1fr}}
.box{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
h2{margin:0 0 8px;font-size:21px}
input#team{font-size:19px;padding:8px;border-radius:10px;border:3px solid #c9cfdb;width:100%;margin-bottom:8px}
.d{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;font-size:17px;padding:10px;margin:6px 0;border-radius:12px;border:3px solid #d5dbe7;background:#fafbfd;cursor:pointer}
.d.on{border-color:#2e9e57;background:#e3f6ea}.d .c{font-weight:bold;background:#12263f;color:#fff;border-radius:8px;padding:3px 8px;white-space:nowrap}
button.big{font-size:20px;font-weight:bold;border:none;border-radius:14px;padding:12px 18px;cursor:pointer;color:#fff;margin:10px 8px 0 0}
.log{background:#0d1117;color:#d7dde8;font-family:Consolas,monospace;font-size:17px;border-radius:12px;padding:12px;min-height:300px;line-height:1.55}
.log .ok{color:var(--neon)}.log .no{color:#ff6b6b}
.say{font-size:19px;margin-top:8px;line-height:1.45}
#plan{display:none;grid-column:1/-1;border:6px solid var(--head);font-size:20px;line-height:1.6}
@media print{header,.noprint{display:none!important}body{background:#fff}main{display:block}#plan{display:block!important}}
</style></head>
<body><header><h1>Cyber Defence HQ</h1><div id="pts"></div></header>
<main>
<div class="box noprint">
 <h2>Mission: protect Sunrise School</h2>
 <input id="team" maxlength="30" placeholder="Team name">
 <div style="font-size:17px">Choose defences. Each costs points. You cannot buy everything, so think like a defender.</div>
 <div id="ds"></div>
 <button class="big" style="background:#d64545" onclick="attack()">Launch the attack wave</button>
</div>
<div class="box noprint">
 <h2>Attack log</h2>
 <div class="log" id="log">Waiting for the red team...</div>
 <div class="say" id="say"></div>
 <button class="big" id="up" style="background:#2f6fd6;display:none" onclick="upgrade()">Get 5 more points and fix the gaps</button>
 <button class="big" id="pl" style="background:#12263f;display:none" onclick="plan()">Make our defence plan</button>
</div>
<div class="box" id="plan"></div>
</main>
<script>
var D=[['Password training: long passwords and three random words',2,'Password guessing'],['Two-step login for every account',3,'Stolen password'],['Link checking: read the real website name',2,'Fake website'],['Stop and check: call back and ask the office',2,'Trickster phone call'],['Door rule: no following people in, visitors sign in',1,'Following through the door'],['Encrypted Wi-Fi only',2,'Wi-Fi snooper'],['App permission checks on school tablets',2,'Snoopy app'],['Check before you share poster',1,'Fake rumour'],['Ethical hacker test (with permission)',2,'Hidden weak spot']];
var A={'Password guessing':'A hacker computer tries common passwords like cricket123.','Stolen password':'A password stolen last week is used to log in.','Fake website':'An email links to schoolhub-login.net to collect passwords.','Trickster phone call':'"I am from IT support. Tell me the office password."','Following through the door':'A stranger follows a teacher into the computer room.','Wi-Fi snooper':'Someone near the school reads open Wi-Fi packets.','Snoopy app':'A free game on a tablet asks for contacts and location.','Fake rumour':'"School closed tomorrow!" spreads in parent chats.','Hidden weak spot':'An old login page nobody remembered is still online.'};
var budget=12,on={},wave=0,busy=false;
function el(x){return document.getElementById(x)}
function spent(){var s=0;D.forEach(function(d,i){if(on[i])s+=d[1]});return s}
function draw(){el('pts').textContent='Points left: '+(budget-spent());el('ds').innerHTML=D.map(function(d,i){return '<button class="d'+(on[i]?' on':'')+'" onclick="tog('+i+')"><span>'+d[0]+'</span><span class="c">'+d[1]+' pts</span></button>'}).join('')}
function tog(i){if(busy)return;if(!on[i]&&spent()+D[i][1]>budget){el('say').textContent='Not enough points. Remove a defence or choose a cheaper one.';return}on[i]=!on[i];draw()}
function attack(){if(busy)return;busy=true;wave++;var L=el('log');L.innerHTML='<b>ATTACK WAVE '+wave+'</b><br>';el('up').style.display='none';el('pl').style.display='none';el('say').textContent='';
 var order=D.map(function(d,i){return i}).sort(function(){return Math.random()-.5}),k=0,stopped=0;
 var iv=setInterval(function(){var i=order[k],d=D[i],ok=!!on[i];if(ok)stopped++;
  L.innerHTML+='&gt; '+d[2]+': '+A[d[2]]+'<br><span class="'+(ok?'ok':'no')+'">'+(ok?'&nbsp;&nbsp;BLOCKED by '+d[0].split(':')[0]:'&nbsp;&nbsp;GOT THROUGH')+'</span><br>';k++;
  if(k>=order.length){clearInterval(iv);busy=false;el('say').innerHTML='<b>'+stopped+' of 9 attacks blocked.</b> '+(stopped<9?'Look at what got through. Which defence would stop it?':'Every attack was blocked. Brilliant defending!');
   if(stopped<9&&budget<17)el('up').style.display='inline-block';el('pl').style.display='inline-block'}},700)}
function upgrade(){budget=17;el('up').style.display='none';draw();el('say').textContent='You have 5 more points. Add defences for the gaps, then launch again.'}
function plan(){var t=el('team').value.trim()||'Our team',p=el('plan');p.style.display='block';
 p.innerHTML='<b style="font-size:28px">'+t.replace(/</g,'&lt;')+': Cyber Defence Plan for Sunrise School</b><ol>'+D.filter(function(d,i){return on[i]}).map(function(d){return '<li><b>'+d[0]+'</b> stops '+d[2].toLowerCase()+'.</li>'}).join('')+'</ol>Attacks we still need to watch: '+(D.filter(function(d,i){return !on[i]}).map(function(d){return d[2].toLowerCase()}).join('; ')||'none')+'<br><br>Signed by our team: ______________________________<br><button class="big noprint" style="background:#12263f" onclick="window.print()">Print plan</button>'}
draw();
</script></body></html>
