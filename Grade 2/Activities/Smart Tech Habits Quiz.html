<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Tech Habits Quiz</title>
<style>
  :root { --ink:#1d2a44; --blue:#2f6fd6; --go:#2e9e57; --stop:#d93a3a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI", Arial, sans-serif; background:#eefbf1; color:var(--ink); }
  header { background:var(--go); color:#fff; padding:14px 20px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  header h1 { margin:0; font-size:26px; }
  .score { font-size:22px; font-weight:bold; }
  main { max-width:820px; margin:24px auto; padding:0 16px; text-align:center; }
  .q { font-size:28px; font-weight:bold; background:#fff; border-radius:18px; padding:26px; box-shadow:0 4px 14px rgba(0,0,0,.08); }
  .num { font-size:18px; color:#56627a; margin-bottom:10px; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:22px; }
  .opts button { font-size:22px; font-weight:bold; border:none; border-radius:16px; padding:22px 14px; cursor:pointer; color:#fff; }
  .a0 { background:#2f6fd6; } .a1 { background:#e07a1f; }
  .fb { font-size:22px; margin-top:18px; padding:14px; border-radius:14px; display:none; }
  .good { background:#dff5e6; border:3px solid var(--go); } .oops { background:#fde3e3; border:3px solid var(--stop); }
  .next { font-size:22px; font-weight:bold; border:none; border-radius:14px; padding:14px 26px; margin-top:16px; background:var(--ink); color:#fff; cursor:pointer; display:none; }
  .big { font-size:30px; }
  @media (max-width:560px){ .opts { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header><h1>Smart Tech Habits Quiz</h1><div class="score" id="score">Score: 0</div></header>
<main>
  <div id="play">
    <div class="q"><div class="num" id="num"></div><div id="text"></div></div>
    <div class="opts"><button class="a0" id="b0" onclick="pickA(0)"></button><button class="a1" id="b1" onclick="pickA(1)"></button></div>
    <div class="fb" id="fb"></div>
    <button class="next" id="next" onclick="nextQ()">Next question</button>
  </div>
  <div id="end" style="display:none">
    <p class="big" id="endmsg"></p>
    <button class="next" style="display:inline-block" onclick="restart()">Play again</button>
  </div>
  <p style="font-size:16px;color:#56627a;margin-top:28px">A practice game for pairs. Nothing is saved or sent.</p>
</main>
<script>
var Q = [
 ['A pop-up says you won a free phone. What do you do?', ['Tap it quickly', 'Stop and ask a grown-up'], 1, 'Free prizes are tricks. Stop, think, ask.'],
 ['It is dinner time with your family. What about the tablet?', ['Put it away', 'Keep playing at the table'], 0, 'Meals are a device-free moment.'],
 ['Your eyes feel tired after a game. What helps?', ['Look far away and rest', 'Move closer to the screen'], 0, 'Give your eyes a break by looking far away.'],
 ['A game asks you to buy gems. What do you do?', ['Buy them', 'Ask a grown-up first'], 1, 'Gems cost real money. Always ask.'],
 ['Something online makes you feel scared. Who can help?', ['Keep it a secret', 'Tell a trusted adult'], 1, 'When in doubt, talk it out.'],
 ['You are using Ammi\'s phone. Can you change the settings?', ['Yes, any time', 'No, ask first'], 1, 'A family device belongs to everyone. Ask first.'],
 ['It is bedtime. Where should the screen be?', ['Put away for the night', 'Under my pillow'], 0, 'Screens before bed make sleep harder.'],
 ['How should you sit at the computer?', ['Sit tall, feet down', 'Slouch low in the chair'], 0, 'Sit tall to look after your back.'],
 ['A message asks for your home address. What do you do?', ['Type it in', 'Do not type it, tell a grown-up'], 1, 'Your address is private.'],
 ['Which is a balanced afternoon?', ['Play, homework, a little screen time', 'Screens all afternoon'], 0, 'Balance means a bit of everything.']
];
var i=0, score=0, done=false;
function el(id){ return document.getElementById(id); }
function show(){
  done=false; var q=Q[i];
  el('num').textContent='Question '+(i+1)+' of '+Q.length; el('text').textContent=q[0];
  el('b0').textContent=q[1][0]; el('b1').textContent=q[1][1];
  el('fb').style.display='none'; el('next').style.display='none';
}
function pickA(a){
  if(done) return; done=true; var q=Q[i]; var ok=(a===q[2]);
  if(ok){ score++; el('score').textContent='Score: '+score; }
  var f=el('fb'); f.className='fb '+(ok?'good':'oops'); f.textContent=(ok?'Yes! ':'Not quite. ')+q[3]; f.style.display='block';
  el('next').style.display='inline-block';
}
function nextQ(){ i++; if(i>=Q.length){ el('play').style.display='none'; el('end').style.display='block'; el('endmsg').textContent='You scored '+score+' out of '+Q.length+'. Well done, smart tech user!'; } else show(); }
function restart(){ i=0; score=0; el('score').textContent='Score: 0'; el('end').style.display='none'; el('play').style.display='block'; show(); }
show();
</script>
</body>
</html>
